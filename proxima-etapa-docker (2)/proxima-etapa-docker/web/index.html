<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Próxima Etapa – Painel Administrativo</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f7f5;color:#12332a}
    header{background:#0b3d2e;color:#fff;padding:16px 24px}
    main{max-width:800px;margin:24px auto;padding:0 16px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:10px;border-bottom:1px solid #dde5e0;text-align:left}
    th{background:#0b3d2e;color:#fff}
    #status{margin-bottom:12px}
  </style>
</head>
<body>
  <header><h1>Próxima Etapa – Painel Administrativo</h1></header>
  <main>
    <p id="status">Verificando API...</p>
    <table>
      <thead><tr><th>ID</th><th>Curso</th><th>Carga horária</th><th>Local</th></tr></thead>
      <tbody id="courses"></tbody>
    </table>
  </main>
  <script>
    fetch('/api/courses')
      .then(r => r.json())
      .then(data => {
        document.getElementById('status').textContent = 'API conectada ✔';
        document.getElementById('courses').innerHTML = data.map(c =>
          `<tr><td>${c.id}</td><td>${c.title}</td><td>${c.workload_hours}h</td><td>${c.location}</td></tr>`
        ).join('');
      })
      .catch(() => document.getElementById('status').textContent = 'Falha ao conectar na API ✖');
  </script>
</body>
</html>
