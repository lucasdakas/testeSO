services:
  db:
    image: mysql:8.0
    container_name: pe-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql                  # persistência dos dados
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - proxima-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: pe-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db                                 # no XAMPP era localhost; no Docker é o nome do serviço
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:3000"
    networks:
      - proxima-net

  web:
    build: ./web
    container_name: pe-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"
    networks:
      - proxima-net

  phpmyadmin:                                     # equivale ao phpMyAdmin do XAMPP (opcional)
    image: phpmyadmin:5
    container_name: pe-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    networks:
      - proxima-net

volumes:
  mysqldata:

networks:
  proxima-net:
    driver: bridge
